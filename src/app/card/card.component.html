<div *ngFor="let user of users">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ user.name }}</mat-card-title>
            <mat-card-subtitle>{{ user.email }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>
                {{ user.company.catchPhrase }}
            </p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button>View Profile</button>
        </mat-card-actions>
    </mat-card>
</div>
